name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI runs `npm install` over a pull request's own package.json, which means it
# executes whatever lifecycle scripts that PR author wrote. It triggers on
# `pull_request` and never on `pull_request_target`, so a fork already gets a
# read-only token and no secrets -- but that depended on a repository setting
# outside this file. Stated here instead.
permissions:
  contents: read

jobs:
  sdk-ts:
    name: "@iaes/sdk (TypeScript)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test

  node-red:
    name: node-red-contrib-iaes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The nodes depend on @iaes/sdk. Build the local copy and point the
      # package at it, so CI tests the code in THIS commit instead of whatever
      # version happens to be on the registry.
      - name: Build the local SDK
        run: npm ci && npm run build
        working-directory: npm
      # The dependency is pointed at the local SDK for the duration of CI.
      # `npm ci` and `npm install` resolve the whole tree from the registry
      # first, so with @iaes/sdk pinned to a range this release has not
      # published yet they fail on ETARGET -- the opposite of what "against the
      # local SDK" promises, and installing the local copy alongside does not
      # help because resolution happens before it lands. Rewriting the range to
      # file:../npm on the runner is what the lockstep in GOVERNANCE.md 3.1
      # requires of a family that versions together: it has to be buildable
      # before it is published. The committed package.json keeps the real range.
      - name: Install nodes against the local SDK
        run: |
          npm pkg set 'dependencies.@iaes/sdk=file:../npm'
          npm install --no-save
        working-directory: node-red
      - run: npm test
        working-directory: node-red

  n8n:
    name: n8n-nodes-iaes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the local SDK
        run: npm ci && npm run build
        working-directory: npm
      - name: Type-check and build
        run: |
          npm pkg set 'dependencies.@iaes/sdk=file:../npm'
          npm install --no-save
          npm run build
        working-directory: n8n-nodes
      # The package shipped a whole major with no suite, and it cost two
      # defects: a hardcoded specification major, and a closed event_type
      # catalog. Both were found by review because nothing ran.
      - run: npm test
        working-directory: n8n-nodes

  sdk-python:
    name: iaes (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tags, so the reproducibility tests run rather than skip. Without
          # them CI reported "1 skipped" and nobody read it -- including the
          # test whose own docstring calls it the only one that would have
          # caught the manifest defect on its own.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # test_cross_language.py shells out to the TypeScript SDK to prove both
      # languages produce the same content_hash. Without dist/ it fails with an
      # empty hash, which reads as a mismatch rather than a missing build.
      - name: Build the TypeScript SDK for the cross-language tests
        run: npm ci && npm run build
        working-directory: npm
      # El paquete declara sus dependencias de prueba en el extra "dev"
      # (pytest, jsonschema, referencing, httpx). Instalar solo pytest
      # pasaba en una maquina que ya tuviera jsonschema y fallaba en CI.
      - run: pip install -e ".[dev]"
      - run: PYTHONPATH=src python -m pytest tests/ -q

  schema-compat:
    name: "schema compatibility (GOVERNANCE.md §4)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The guard compares the tree against a baseline, so it needs history.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Resolve the baseline
        id: base
        run: |
          # A pull request is judged against its target branch; a push to main
          # against the previous commit. Either way the question is the same:
          # does this change break a consumer that was reading the old schemas?
          if [ -n "${{ github.base_ref }}" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Check for breaking schema changes
        run: python tools/check_schema_compat.py --baseline "${{ steps.base.outputs.ref }}"

  frontier:
    name: "the standard depends on nothing of ours (GOVERNANCE.md §1)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Stdlib only, deliberately: this must be able to run and fail even when
      # the language toolchains do not install.
      - name: Check for normative dependency on the steward
        run: python tools/check_frontier.py
      # A citation to a section of this standard must resolve to a section that
      # exists. Stdlib only, like its neighbour.
      - name: Check that section citations resolve
        run: python tools/check_citations.py
      # Second rung: is the cited document identified, and can anyone consult
      # it? Separate from the first on purpose -- a red build should say which.
      - name: Check that cited documents are declared and their availability stated
        run: python tools/check_document_available.py
      # The check above is stdlib only; only its arming test needs pytest.
      - run: pip install pytest
      - name: Prove the check still catches the crossings it was armed against
        run: python -m pytest tests/test_frontier.py -q
