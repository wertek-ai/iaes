name: Release

# Publishing is driven by tags, one prefix per package, so every published
# artifact is traceable to a commit. Nothing here uses a stored token: npm and
# PyPI both authenticate this workflow through OIDC (Trusted Publishing).
#
#   sdk-v0.3.0      -> @iaes/sdk               (npm)
#   nodered-v0.4.0  -> node-red-contrib-iaes   (npm)
#   n8n-v0.2.0      -> n8n-nodes-iaes          (npm)
#   py-v0.3.0       -> iaes                    (PyPI)
#
# One-time setup, per package, before the first run:
#   npm   — npmjs.com > package > Settings > Trusted Publisher > GitHub Actions
#           (repo wertek-ai/iaes, workflow release.yml)
#   PyPI  — pypi.org > project > Publishing > add a GitHub trusted publisher

on:
  push:
    tags:
      - "sdk-v*"
      - "nodered-v*"
      - "n8n-v*"
      - "py-v*"

jobs:
  publish-npm:
    if: startsWith(github.ref_name, 'sdk-v') || startsWith(github.ref_name, 'nodered-v') || startsWith(github.ref_name, 'n8n-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1; Node 20 ships an older npm.
      - run: npm install -g npm@latest

      - name: Pick the package for this tag
        id: pick
        run: |
          case "${GITHUB_REF_NAME}" in
            sdk-v*)     echo "dir=npm"        >> "$GITHUB_OUTPUT" ;;
            nodered-v*) echo "dir=node-red"   >> "$GITHUB_OUTPUT" ;;
            n8n-v*)     echo "dir=n8n-nodes"  >> "$GITHUB_OUTPUT" ;;
          esac

      # Guard: the tag and the package version must agree. Otherwise a mistyped
      # tag publishes a version nobody can trace back to it.
      - name: Check the tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#*-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $TAG_VERSION but package.json says $PKG_VERSION"
            exit 1
          fi
        working-directory: ${{ steps.pick.outputs.dir }}

      - name: Build the local SDK
        if: steps.pick.outputs.dir != 'npm'
        run: npm ci && npm run build
        working-directory: npm

      - name: Install and test
        run: |
          npm ci
          if [ "${{ steps.pick.outputs.dir }}" != "npm" ]; then
            npm install --no-save ../npm
          fi
          npm test --if-present
        working-directory: ${{ steps.pick.outputs.dir }}

      - name: Publish
        run: npm publish
        working-directory: ${{ steps.pick.outputs.dir }}

  publish-pypi:
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches pyproject.toml
        run: |
          PKG_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#py-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $TAG_VERSION but pyproject.toml says $PKG_VERSION"
            exit 1
          fi

      - run: pip install build
      - run: pip install -e ".[dev]"
      - run: PYTHONPATH=src python -m pytest tests/ -q -k "not cross_language"
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
