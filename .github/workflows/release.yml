name: Release

# Publishing is driven by tags, one prefix per package, so every published
# artifact is traceable to a commit. Nothing here uses a stored token: npm and
# PyPI both authenticate this workflow through OIDC (Trusted Publishing).
#
#   sdk-v0.3.0      -> @iaes/sdk               (npm)
#   nodered-v0.4.0  -> node-red-contrib-iaes   (npm)
#   n8n-v0.2.0      -> n8n-nodes-iaes          (npm)
#   py-v0.3.0       -> iaes                    (PyPI)
#
# One-time setup, per package, before the first run:
#   npm   — npmjs.com > package > Settings > Trusted Publisher > GitHub Actions
#           (repo wertek-ai/iaes, workflow release.yml)
#   PyPI  — pypi.org > project > Publishing > add a GitHub trusted publisher

on:
  push:
    tags:
      - "sdk-v*"
      - "nodered-v*"
      - "n8n-v*"
      - "py-v*"

jobs:
  publish-npm:
    if: startsWith(github.ref_name, 'sdk-v') || startsWith(github.ref_name, 'nodered-v') || startsWith(github.ref_name, 'n8n-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1 and Node 20 ships 10.x.
      # Pinned to the 11 line on purpose: npm@latest is now 12, which requires
      # Node >= 22 and fails on the same Node 20 that CI tests against.
      - run: npm install -g npm@^11

      - name: Pick the package for this tag
        id: pick
        run: |
          case "${GITHUB_REF_NAME}" in
            sdk-v*)     echo "dir=npm"        >> "$GITHUB_OUTPUT" ;;
            nodered-v*) echo "dir=node-red"   >> "$GITHUB_OUTPUT" ;;
            n8n-v*)     echo "dir=n8n-nodes"  >> "$GITHUB_OUTPUT" ;;
          esac

      # Guard: the tag and the package version must agree. Otherwise a mistyped
      # tag publishes a version nobody can trace back to it.
      - name: Check the tag matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#*-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $TAG_VERSION but package.json says $PKG_VERSION"
            exit 1
          fi
        working-directory: ${{ steps.pick.outputs.dir }}

      # Every test file requires ../dist, and dist is not committed. The SDK's
      # own build used to be skipped here because the step was framed as
      # "build the DEPENDENCY" — so when the package being published WAS the
      # SDK, nothing built it and its tests could not even load. prepublishOnly
      # builds, but that runs after the tests, which is too late to be tested.
      - name: Build the SDK
        run: npm ci && npm run build
        working-directory: npm

      - name: Install, build and test
        run: |
          npm ci
          if [ "${{ steps.pick.outputs.dir }}" != "npm" ]; then
            npm install --no-save ../npm
          fi
          # Build before testing. n8n-nodes compiles to dist/ and its suite
          # loads the COMPILED artifact -- which is what the package publishes,
          # and checking the TypeScript instead would pass over a build that
          # never emitted the fix. This step used to test without building,
          # which nothing noticed because n8n-nodes had no tests at all until
          # 2.0. `prepublishOnly` builds too, but that runs after the tests.
          npm run build --if-present
          npm test --if-present
        working-directory: ${{ steps.pick.outputs.dir }}

      - name: Publish
        run: npm publish
        working-directory: ${{ steps.pick.outputs.dir }}

  publish-pypi:
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for PyPI Trusted Publishing
    steps:
      - uses: actions/checkout@v4
        with:
          # Same history as ci.yml. The reproducibility tests need the spec
          # tags; a depth-1 checkout has none, so py-v2.0.1 ran here with two
          # of them silently skipped while CI on the same commit ran them.
          # The release gate must not run a smaller suite than CI.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Same step as ci.yml. The Python suite includes the reference scenarios
      # and the cross-language test, which compile and run the TypeScript
      # scenario against npm/dist. Until 2.0.1 this job never built it and
      # deselected the one test that needed it, so the publish gate ran a
      # smaller suite than CI. py-v2.0.1 failed here on the first run because
      # the scenarios battery does not carry the deselected name: it reports
      # "npm/dist is not built" instead of quietly skipping.
      - name: Build the TypeScript SDK for the cross-language tests
        run: npm ci && npm run build
        working-directory: npm
      # The reference scenarios (tests/test_reference_scenarios.py) also run the
      # Node-RED flow in a real Node-RED -- a dev dependency of node-red/ -- and
      # the n8n workflow against the COMPILED n8n nodes, which is what n8n
      # loads. Same install shape as those packages' own jobs. The range is
      # restored afterwards so the tree pytest sees is the committed one.
      - name: Install the Node-RED package, with its runtime, against the local SDK
        run: |
          npm pkg set 'dependencies.@iaes/sdk=file:../npm'
          npm install --no-save
          git checkout -- package.json
        working-directory: node-red
      - name: Build the n8n nodes against the local SDK
        run: |
          npm pkg set 'dependencies.@iaes/sdk=file:../npm'
          npm install --no-save
          npm run build
          git checkout -- package.json
        working-directory: n8n-nodes

      - name: Check the tag matches pyproject.toml
        run: |
          PKG_VERSION=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#py-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $TAG_VERSION but pyproject.toml says $PKG_VERSION"
            exit 1
          fi

      - run: pip install build
      - run: pip install -e ".[dev]"
      - run: PYTHONPATH=src python -m pytest tests/ -q
      - run: python -m build
      # Pinned to a commit, not to the mutable `release/v1` branch. This job
      # holds `id-token: write`, so whoever controls that branch controls a
      # token that can publish to PyPI as us. Resolved from release/v1 on
      # 2026-09-08, which was v1.14.2.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
