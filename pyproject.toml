[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iaes"
version = "1.4.1"
description = "Industrial Asset Event Standard — vendor-neutral event models for industrial asset intelligence"
readme = "README.md"
license = "CC-BY-4.0"
requires-python = ">=3.9"
authors = [{ name = "Wertek AI", email = "engineering@wertek.ai" }]
keywords = [
    "industrial",
    "asset",
    "iot",
    "maintenance",
    "cmms",
    "predictive",
    "condition-monitoring",
    "iiot",
    "reliability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
validate = ["jsonschema>=4.0", "referencing>=0.30"]
async = ["httpx>=0.24"]
dev = ["pytest>=7.0", "jsonschema>=4.0", "referencing>=0.30", "httpx>=0.24", "pyyaml>=6.0"]

[project.urls]
Homepage = "https://iaes.dev"
Documentation = "https://iaes.dev"
Repository = "https://github.com/wertek-ai/iaes"
Changelog = "https://github.com/wertek-ai/iaes/blob/main/IAES_SPEC.md#version-history"

[tool.hatch.build.targets.sdist]
# El paquete de Python vive en src/iaes. Sin esta lista, hatchling barre el
# monorepo completo — incluido n8n-nodes/node_modules, que son 2,627 archivos
# y 6.8 MB de un paquete que pesa 26 KB.
include = [
    "/src/iaes",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/IAES_SPEC.md",
    "/CHANGELOG.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/iaes"]
